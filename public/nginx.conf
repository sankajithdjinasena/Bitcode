# ================================================================
#  SwiftDrop — NGINX configuration
#  High-concurrency flash-sale protection
#
#  Place in:  /etc/nginx/sites-available/swiftdrop
#  Enable:    ln -s /etc/nginx/sites-available/swiftdrop \
#                   /etc/nginx/sites-enabled/swiftdrop
#             nginx -t && systemctl reload nginx
# ================================================================

# ── Rate-limit zones ─────────────────────────────────────────────
# Defined in the http { } block (nginx.conf or conf.d/limits.conf)
# Paste these two lines there if not already present:
#
#   limit_req_zone  $binary_remote_addr zone=purchase_rl:10m  rate=2r/s;
#   limit_req_zone  $binary_remote_addr zone=general_rl:10m   rate=20r/s;
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
#
# ─────────────────────────────────────────────────────────────────

upstream php_fpm_pool {
    # Point to your PHP-FPM socket (adjust path as needed)
    server unix:/run/php/php8.2-fpm.sock;

    # Optional: add more FPM workers / servers for true load balancing
    # server unix:/run/php/php8.2-fpm-2.sock;
    # server 127.0.0.1:9001;

    keepalive 32;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root  /var/www/swiftdrop/public;
    index index.php index.html;

    # ── General connection limit ─────────────────────────────────
    limit_conn conn_limit 20;          # max 20 simultaneous connections per IP
    limit_req  zone=general_rl burst=40 nodelay;

    # ── Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 512;

    # ── Static assets — long cache, no rate limiting ─────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────────────
    #  purchase.php  — the hot path
    #  Strict rate limit: 2 requests/sec per IP, burst queue of 5.
    #  After the queue fills, NGINX returns 429 immediately rather
    #  than letting requests pile up in PHP-FPM.
    # ────────────────────────────────────────────────────────────
    location = /purchase.php {
        limit_req  zone=purchase_rl burst=5 nodelay;
        limit_req_status 429;

        # Return a JSON 429 so the JS toast can display it
        error_page 429 = @purchase_throttled;

        include        fastcgi_params;
        fastcgi_pass   php_fpm_pool;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Keep PHP-FPM connections alive
        fastcgi_keep_conn on;

        # Timeouts — flash sales should be fast
        fastcgi_read_timeout   10s;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout   10s;
    }

    location @purchase_throttled {
        default_type application/json;
        return 429 '{"success":false,"message":"Too many requests — please wait a moment and try again."}';
    }

    # ── stock.php — polled every 2 s by every browser ────────────
    #  Serve a micro-cache so 1 000 tabs don't hammer MySQL.
    location = /stock.php {
        # Micro-cache: responses cached for 1 second by NGINX.
        # 1 000 users polling every 2 s → only 1 MySQL query/s
        # instead of 500.
        fastcgi_cache_valid 200 1s;
        add_header X-Cache $upstream_cache_status;

        include        fastcgi_params;
        fastcgi_pass   php_fpm_pool;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_keep_conn on;
    }

    # ── All other PHP ─────────────────────────────────────────────
    location ~ \.php$ {
        limit_req zone=general_rl burst=20 nodelay;

        include        fastcgi_params;
        fastcgi_pass   php_fpm_pool;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_keep_conn on;
        fastcgi_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Deny direct access to sensitive dirs ──────────────────────
    location ~* /(app|config|middleware)/ {
        deny all;
        return 404;
    }

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
}
